[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "xai-rsf"
version = "0.1.0"
description = "Experimental path-constrained competing-risk forests with exact CIF functions"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "scikit-learn>=1.3", "pyarrow>=14", "threadpoolctl>=3.1"]
[project.optional-dependencies]
dev = ["pytest>=8"]
benchmarks = ["interpret-core==0.7.8", "shap==0.54.1", "matplotlib==3.11.2"]
[tool.setuptools.packages.find]
include = ["crforest*"]
